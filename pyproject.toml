[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "hornet"
version = "0.1.0"
description = "Kali Linux terminal AI copilot for CTF work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ctf", "kali", "ai", "hacking", "pentesting"]

# stdlib-first: no required runtime dependencies
dependencies = []

[project.scripts]
hnet = "hornet.cli:main"

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hornet*"]

[tool.black]
line-length = 100
target-version = ["py310"]
